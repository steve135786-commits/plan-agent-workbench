[package]
name = "plan-agent-workbench"
version = "0.1.0"
description = "PlanAgent Workbench — ACP planning workbench desktop (Tauri 2)"
authors = ["PlanAgent"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "plan_agent_workbench_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Test-only: exposes tauri::test::mock_app() for the end-to-end test in
# workflows.rs (the app's run/approve path against the real CLI).
# The production binary does not include it.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.dev]
incremental = true
